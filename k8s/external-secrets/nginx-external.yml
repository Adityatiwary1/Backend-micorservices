apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: nginx-external-secret
  namespace: backendmicro
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
   #ssm has stored them a s json
   #name in secretkey envfrom willmake ths same name as env varibale
   #property name can be diff from actual env value but do avoid confusion keep the same name
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore

  target:
    name: nginx-secret
    creationPolicy: Owner

  data:         
   - secretKey: JWT_SECRET
     remoteRef:
      key: prod/backendmicro/nginx-service #parameter name if secret collection
      property: JWT_SECRET
  