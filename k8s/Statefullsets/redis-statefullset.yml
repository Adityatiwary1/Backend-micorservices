apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis-headless-service
  replicas: 2

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
       labels:
           app: redis

    spec:
      containers:
        - name: redis
          image: <accountid>.dkr.ecr.<ecr_region>.amazonaws.com/<reponame>/redis-service:1.0.0
          
          envFrom:
            - secretRef : 
                    name : redis-secret           

          
          volumeMounts:
            - name: redis-data
              mountPath: /data

            - name: redis-config
              mountPath: /templates


      volumes:
        - name: redis-config
          configMap:
            name: redis-config
  volumeClaimTemplates:
      - metadata:
          name: redis-data
        spec:
          storageClassName: clous-store-ebs
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi