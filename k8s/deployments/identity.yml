apiVersion : apps/v1
kind : Deployment
metadata : 
       name : user-deployment
       namespace : backendmicro 
       labels: 
           app: user
spec: 
   replicas : 3
   strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

   selector :
        app : user
   template : 
        metadata : 
              label :
                  app : user                      
        spec :
           #terminationGracePeriodSeconds: 60
           containers :
                    -  name : user-container
                       image: <accountid>.dkr.ecr.<ecr_region>.amazonaws.com/<reponame>/user-service:1.0.0
                       envFrom:
                           - secretRef:
                                   name: user-secret
                           - configMapRef:
                                   name: user-config
                       ports:
                           - name: http
                             containerPort: 3001

                       readinessProbe:
                           httpGet:
                              path: /health
                              port: http
                              scheme: HTTP
                           initialDelaySeconds: 5
                           periodSeconds: 10
                           timeoutSeconds: 2
                           failureThreshold: 3
                           successThreshold: 1
